spring.application.name=pagamento-service
server.port=8080

# Banco proprio do servico (pagamento-db). Sobrescrito no Docker Compose via
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5432/pagamento
spring.datasource.username=pagamento
spring.datasource.password=pagamento

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Sobrescrito no Docker Compose via SPRING_RABBITMQ_HOST
spring.rabbitmq.host=localhost