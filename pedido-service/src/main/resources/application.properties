spring.application.name=pedido-service
server.port=8080

# Banco proprio do servico (pedido-db). Sobrescrito no Docker Compose via
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5432/pedido
spring.datasource.username=pedido
spring.datasource.password=pedido

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

estoque.url=${ESTOQUE_SERVICE_URL:http://localhost:8081}
simulacao.falha-apos-reserva=${SIMULAR_FALHA_APOS_RESERVA:false}
spring.rabbitmq.host=localhost